name: Publish images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.4.1 (leading v accepted)"
        required: true

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plain
            dockerfile: Dockerfile
            suffix: ""
            alias: ""
          - name: vl-baked
            dockerfile: Dockerfile.vl-baked
            suffix: "-vl-baked"
            alias: "edgaras0x4e/paddleocr-pdf-api:latest-baked"
          - name: text-baked
            dockerfile: Dockerfile.text-baked
            suffix: "-text-baked"
            alias: ""
          - name: structure-baked
            dockerfile: Dockerfile.structure-baked
            suffix: "-structure-baked"
            alias: ""
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Normalize version
        id: ver
        run: echo "version=${RAW#v}" >> "$GITHUB_OUTPUT"
        env:
          RAW: ${{ inputs.version }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            edgaras0x4e/paddleocr-pdf-api:latest${{ matrix.suffix }}
            edgaras0x4e/paddleocr-pdf-api:v${{ steps.ver.outputs.version }}${{ matrix.suffix }}
            ${{ matrix.alias }}
